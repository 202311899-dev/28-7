<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Todo App</title>
    <link rel="stylesheet" href="/static/style.css?v=2.0">
</head>
<body>
    <div class="container" style="max-width: 400px; margin-top: 50px;">
        <h1>Welcome Back</h1>
        <p style="color: #64748b; margin-bottom: 20px;">Log in to manage your tasks</p>

        <!-- Container for JS error messages -->
        <div id="error-container"></div>

        <form id="login-form">
            <div class="form-group" style="margin-bottom: 15px;">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn" style="width: 100%;">Log In</button>
        </form>

        <p style="text-align: center; margin-top: 20px; color: #64748b;">
            Don't have an account? <a href="/register">Sign up here</a>
        </p>
    </div>

    <!-- Include your JavaScript file -->
    <script src="/static/login.js"></script>
</body>
</html>
